name: Publish Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.vscode/**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        id: version
        run: echo "version=$(node scripts/get-version.js)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # p-cloud is x86_64, and the runner is too, so nothing is emulated.
          # Building linux/arm64 through QEMU used to take over an hour whenever
          # a lockfile change invalidated the cache, because sqlite3 and sharp
          # are compiled from source.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/renajohn/dexvault:latest
            ghcr.io/renajohn/dexvault:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
