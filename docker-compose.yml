services:
  dexvault:
    image: ghcr.io/renajohn/dexvault:latest
    volumes:
      - dexvault_data:/data
      # The library Navidrome reads (read-only there): DexVault writes an .lrc
      # beside each ripped track it has lyrics for, which Navidrome hands to its
      # players. The container runs as root and gives each file to the owner of
      # its album folder. Without MUSIC_LIBRARY_PATH, no file is written.
      - /home/rjl/Music:/music
    networks:
      - web
    # The media listener for the appliances DexVault plays on (UPnP: the Onkyo,
    # the WiiM). Plain HTTP on a port of its own, past Traefik on purpose:
    # Traefik sends all HTTP to HTTPS, which an appliance may not follow. It
    # serves only files and covers by a play's token, on the LAN (the router
    # does not publish it), never the API nor Navidrome's credentials.
    ports:
      - "3002:3002"
    # Google's resolvers, which the router forwards to, answer SERVFAIL for
    # bnf.fr: the BnF's catalogue, which completes the French books, was out of
    # reach. Docker's own DNS still answers for the containers (next-mtp,
    # navidrome) and sends the rest to these.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    environment:
      - NODE_ENV=production
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      # Without this the container has no token, isConfigured() is false and
      # every lookup goes straight to MusicBrainz -- Discogs, the primary
      # source, is never consulted.
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      # DoesTheDogDie key for the spider and snake warnings. Without it every
      # movie stays "unknown" and the daily refresh does nothing.
      - DOES_DOG_DIE=${DOES_DOG_DIE:-}
      # Google Books key for finding books as one types. Without it every
      # search shares Google's anonymous daily quota, spent most days.
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      # Reach the vision model over the shared docker network rather than back
      # out through Traefik: its mkcert certificate is not verifiable by the
      # CA store Node ships with, which made every cover scan fail as
      # "Cover scan service is not available".
      - LLM_BASE_URL=${LLM_BASE_URL:-http://next-mtp:8080}
      # Nightly backup to Dropbox (see README, "Dropbox backup"). Without these three,
      # nothing is scheduled and the Backup page says so.
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY:-}
      - DROPBOX_APP_SECRET=${DROPBOX_APP_SECRET:-}
      - DROPBOX_REFRESH_TOKEN=${DROPBOX_REFRESH_TOKEN:-}
      # Navidrome, for the ripping progress: which CDs are already in the library,
      # and in which format. Reached over the shared "web" network, not through
      # Traefik, whose mkcert certificate Node cannot verify. Without a user and
      # password, the Ripping page says Navidrome is not configured.
      - NAVIDROME_URL=${NAVIDROME_URL:-http://navidrome:4533}
      - NAVIDROME_USER=${NAVIDROME_USER:-}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-}
      # Where a browser opens an album in Navidrome, from an album's Listen button.
      - NAVIDROME_PUBLIC_URL=${NAVIDROME_PUBLIC_URL:-https://music.lab.crog.org}
      # The secret the DexVault plugin in Navidrome sends with every account's
      # plays and likes (see navidrome-plugin/). With it, the plugin counts all
      # the plays; without it, they are refused and the counters count as before.
      - NAVIDROME_PLUGIN_TOKEN=${NAVIDROME_PLUGIN_TOKEN:-}
      # The mount above, where Navidrome's song paths are resolved.
      - MUSIC_LIBRARY_PATH=/music
      # The appliances to play on, by the URL of their description: they answer
      # no search from inside Docker's bridge (DHCP reservations on the router
      # for the Onkyo's cable at .55, the WiiM's .20 and p-cloud's .50). Without
      # UPNP_MEDIA_BASE_URL nothing of it runs: no listener, no appliance, only
      # "This computer" on the page.
      - UPNP_RENDERERS=${UPNP_RENDERERS:-http://192.168.86.55:8888/upnp_descriptor_0,http://192.168.86.20:49152/description.xml}
      - UPNP_MEDIA_PORT=3002
      # What the appliances call, resolved by the LAN's DNS to p-cloud:
      # http://dexvault.lab.crog.org:3002, set in the stack's variables once
      # the play on the Onkyo is to be tried; empty, UPnP stays off.
      - UPNP_MEDIA_BASE_URL=${UPNP_MEDIA_BASE_URL:-}
      # The volume DexVault never sets above, unless an appliance has its own.
      - UPNP_MAX_VOLUME=${UPNP_MAX_VOLUME:-70}
      # The remote for the browsers, kept until playing on the appliances is trusted.
      - REMOTE_ENABLED=${REMOTE_ENABLED:-true}
      # The backup runs at 3 a.m. local time: without TZ the container runs on UTC.
      - TZ=Europe/Zurich
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.dexvault.rule=Host(`dexvault.lab.crog.org`)"
      - "traefik.http.routers.dexvault.entrypoints=websecure"
      - "traefik.http.routers.dexvault.tls=true"
      - "traefik.http.services.dexvault.loadbalancer.server.port=3001"
      # MCP server: separate router on its own subdomain. The client talks to
      # https://dexvault-mcp.lab.crog.org/ (root) and the addprefix middleware
      # rewrites the path so the backend receives POST /mcp.
      - "traefik.http.routers.dexvault-mcp.rule=Host(`dexvault-mcp.lab.crog.org`)"
      - "traefik.http.routers.dexvault-mcp.entrypoints=websecure"
      - "traefik.http.routers.dexvault-mcp.tls=true"
      - "traefik.http.routers.dexvault-mcp.service=dexvault"
      - "traefik.http.routers.dexvault-mcp.middlewares=dexvault-mcp-prefix"
      - "traefik.http.middlewares.dexvault-mcp-prefix.addprefix.prefix=/mcp"
      - homepage.group=Apps
      - homepage.name=DexVault
      - homepage.href=https://dexvault.lab.crog.org
      - homepage.icon=https://dexvault.lab.crog.org/logo192.png
      - homepage.description=Gestion de collection de films, musique et livres
volumes:
  dexvault_data:

networks:
  web:
    external: true
